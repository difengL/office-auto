<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1d212a; --line:#272c37;
    --text:#e6e8ee; --muted:#8b93a7; --accent:#ff7a45; --accent-2:#ffb020;
    --ok:#3ecf8e; --warn:#e8b424; --err:#ec5b5b; --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2030 0%,var(--bg) 55%);
    color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    min-height:100vh;padding:28px 20px 60px;
  }
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  h1{font-size:21px;margin:0}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:var(--panel)}
  .badge.on{color:var(--ok);border-color:#1f4d3a;background:#10231b}
  .badge.warn{color:var(--warn);border-color:#4d3f1f;background:#231f10}
  .badge.err{color:var(--err);border-color:#5a2323;background:#2a1717}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 14px;color:var(--muted);letter-spacing:.8px;
    text-transform:uppercase;font-weight:600}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#12151c;color:var(--text);font-size:15px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{padding:10px 18px;border-radius:10px;border:0;cursor:pointer;font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a1206;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}

  /* 按钮加载态：转圈 + 文案，让 3~8 秒的等待可见 */
  button.loading{position:relative;color:transparent !important;pointer-events:none}
  button.loading::after{
    content:"";position:absolute;top:50%;left:50%;width:16px;height:16px;
    margin:-8px 0 0 -8px;border-radius:50%;
    border:2px solid rgba(0,0,0,.25);border-top-color:currentColor;
    animation:btn-spin .7s linear infinite}
  button.ghost.loading::after{border-color:rgba(230,232,238,.25);border-top-color:var(--text)}
  /* 主按钮的 spinner 用深色，透明白会看不清 */
  button:not(.ghost).loading::after{
    border-color:rgba(26,18,6,.25);border-top-color:#1a1206}
  @keyframes btn-spin{to{transform:rotate(360deg)}}

  /* 顶部进度条：任何请求进行中时显示 */
  #topbar{position:fixed;top:0;left:0;height:2px;width:0;z-index:99;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .25s ease,opacity .3s;opacity:0}
  #topbar.on{opacity:1}

  button.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-weight:400}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;gap:16px}
  @media(min-width:820px){.grid.cols{grid-template-columns:1fr 1fr}}
  .muted{color:var(--muted)}
  .err{color:var(--err)}
  .ok{color:var(--ok)}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
    background:#22262f;border:1px solid var(--line);padding:12px 20px;border-radius:12px;
    opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;bottom:44px}
  .toast.ok{border-color:#1f4d3a}
  .toast.err{border-color:#5a2323}
  .logline{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .logline:last-child{border:0}
  .logline .t{color:var(--muted);margin-right:8px}
  a.cardlink{text-decoration:none;color:inherit;display:block;transition:.15s}
  a.cardlink:hover{border-color:var(--accent);transform:translateY(-2px)}
  .fname{font-size:17px;font-weight:600;margin-bottom:6px}
  .fdesc{font-size:13px;color:var(--muted);margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .kv span:first-child{color:var(--muted)}
  .switch{display:flex;align-items:center;gap:10px;margin:0;font-size:14px;color:var(--text)}
  .switch input{width:auto;accent-color:var(--accent)}
  .switches{display:flex;flex-wrap:wrap;gap:22px}
  .note{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13px;
    line-height:1.6;color:var(--muted);background:#12151c;border:1px solid var(--line)}
  .note b{color:var(--text);font-weight:600}
  .note .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--ok);margin-right:8px;vertical-align:middle;
    box-shadow:0 0 0 3px rgba(62,207,142,.15)}
  .badge.busy{color:var(--accent-2);border-color:#4d3f1f}

  /* 返回按钮 */
  a.back{text-decoration:none;padding:8px 14px;border:1px solid var(--line);
    border-radius:10px;color:var(--text);transition:.15s;font-size:14px}
  a.back:hover{border-color:var(--accent);color:var(--accent)}

  /* 登录卡：未登录时居中收窄，聚焦 */
  .login-card{max-width:440px;margin:48px auto;padding:28px}
  .login-head{margin-bottom:22px}
  .login-head h2{font-size:17px;margin:0 0 6px;color:var(--text);
    letter-spacing:0;text-transform:none;font-weight:600}
  .login-head p{margin:0;font-size:13px;line-height:1.6}
  .login-card .fields label:first-child{margin-top:0}

  /* 身份卡 */
  .identity{display:flex;align-items:center;gap:18px;
    background:linear-gradient(135deg,rgba(255,122,69,.10),var(--panel-2))}
  .identity .avatar{width:52px;height:52px;flex:0 0 52px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:21px;font-weight:600;color:#1a1206;
    background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .identity .who-label{font-size:11px;letter-spacing:1px;color:var(--muted);
    text-transform:uppercase;font-weight:600}
  .identity .who-name{font-size:19px;font-weight:600;margin:2px 0 3px}
  .identity .who-sub{font-size:12px;color:var(--muted)}

  [hidden]{display:none !important}

  /* 菜品列表（推荐 / 可订 / 已订） */
  .dish-list{display:flex;flex-direction:column;gap:8px}
  .dish{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;
    align-items:center;padding:10px 14px;border:1px solid var(--line);
    border-radius:10px;background:#12151c}
  .dish .dish-main{display:flex;align-items:center;gap:10px}
  .dish .dish-name{font-weight:600}
  .dish .score{font-size:12px;color:var(--accent-2);font-weight:600}
  .dish .price{color:var(--accent);font-weight:600;white-space:nowrap}
  .dish .reasons{grid-column:1/-1;font-size:12px;margin-top:2px}
  input[type=date]{color-scheme:dark}

  /* 今日订餐状态卡：最显眼位置 */
  .today-card{border-color:#3a4150;
    background:linear-gradient(135deg,rgba(255,122,69,.08),var(--panel-2))}
  .today-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .today-head h2{margin:0;font-size:15px;color:var(--text);letter-spacing:0;
    text-transform:none;font-weight:700}
  .today-ordered{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .today-badge{font-size:15px;font-weight:700;padding:6px 16px;border-radius:999px;
    white-space:nowrap}
  .today-badge.ok{color:var(--ok);background:#10231b;border:1px solid #1f4d3a}
  .today-badge.warn{color:var(--warn);background:#231f10;border:1px solid #4d3f1f}
  .today-dishes{display:flex;gap:10px;flex-wrap:wrap}
  .today-dish{font-size:15px;font-weight:600}
  .today-dish em{font-style:normal;color:var(--accent);margin-left:6px;font-weight:600}
  .today-meta{font-size:13px;color:var(--muted)}

  /* 今日订餐内的页签与逐条订餐按钮 */
  .meal-tabs{display:flex;gap:10px;margin:18px 0 14px}
  .meal-tabs .tab{padding:7px 16px;font-size:14px}
  .meal-tabs .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#1a1206;font-weight:600;border-color:transparent}
  .order-btn{padding:6px 16px;font-size:13px;border-radius:8px;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1a1206;
    font-weight:600;white-space:nowrap;grid-row:1;grid-column:3}
  .order-btn:disabled{opacity:.5;cursor:not-allowed}
  .dish{grid-template-columns:1fr auto auto}
  /* 订满/打烊的餐厅置灰，与手机端一致 */
  .dish.unavailable{opacity:.45}
  .dish.unavailable .dish-name{font-weight:400}
  .dish.unavailable .order-btn{background:var(--panel-2);color:var(--muted);
    border:1px solid var(--line);opacity:1;cursor:not-allowed}
  .quota{margin-left:8px;font-size:12px;color:var(--muted);white-space:nowrap}
  .quota.full{color:var(--err)}
  .order-btn.current{background:#10231b;color:var(--ok);border:1px solid #1f4d3a;
    opacity:1;cursor:default}
  .dish.current-dish{border-color:#1f4d3a;background:#10231b}

  /* 餐次状态提示（未开放/已关闭/已订满） */
  .slot-note{display:flex;align-items:flex-start;gap:9px;margin:0 0 14px;
    padding:11px 14px;border-radius:9px;border:1px solid #4a3c1a;
    background:#221c0e;color:#e0c68a;font-size:13px;line-height:1.5}
  .slot-note-icon{flex:none;font-size:15px;line-height:1.3}

  /* 逐日工时设置 */
  .hours-box{margin-top:18px;padding:14px 16px;border:1px solid var(--line);
    border-radius:10px;background:#12151c}
  .hours-head{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .hours-title{font-weight:600;font-size:14px}
  .hours-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .hours-cell{display:flex;flex-direction:column;gap:5px;margin:0}
  .hours-day{font-size:12px;color:var(--muted)}
  .hours-cell input{padding:7px 9px;font-size:14px;text-align:center}
  .hours-unit{font-size:11px;color:var(--muted);text-align:center}
  .hours-foot{display:flex;align-items:center;gap:14px;margin-top:12px}
  .hours-foot button{margin-left:auto}
  @media(max-width:640px){.hours-grid{grid-template-columns:repeat(2,1fr)}}

  /* 本周水果推荐 */
  .fruit-box{margin:16px 0;padding:14px 16px;border-radius:10px;
    background:#12151c;border:1px solid var(--line)}
  .fruit-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .fruit-title{font-weight:600;font-size:14px}
  .fruit-head button{margin-left:auto}
  .fruit-today{font-size:14px;line-height:1.6}
  .fruit-day{display:inline-block;min-width:42px;font-weight:600;color:var(--accent-2);
    margin-right:8px}
  .fruit-week{margin-top:12px;display:flex;flex-direction:column;gap:8px;
    border-top:1px dashed var(--line);padding-top:12px}
  .fruit-row{font-size:13px;line-height:1.5;display:flex;gap:8px}
  .fruit-row.cur{color:var(--text)}
  .fruit-row.cur .fruit-day{color:var(--accent)}
  .fruit-row:not(.cur){color:var(--muted)}
</style>
