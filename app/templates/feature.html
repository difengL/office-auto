<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>功能面板</title>
{% include '_style.html' %}
</head>
<body>
<div id="topbar"></div>
<div class="wrap">
  <header>
    <a href="/" class="back">← 返回</a>
    <h1 id="fname">加载中…</h1>
    <span class="badge" id="stateBadge"></span>
  </header>

  <!-- ① 未登录 / 切换账号：只显示登录框 -->
  <section id="loginPanel" class="card login-card" hidden>
    <div class="login-head">
      <h2 id="loginTitle">登录</h2>
      <p class="muted" id="credHint"></p>
    </div>
    <div id="fields" class="fields"></div>
    <div class="row" style="margin-top:20px">
      <button id="btnLogin">保存并登录</button>
      <button id="btnCancelSwitch" class="ghost" hidden>取消</button>
    </div>
  </section>

  <!-- ② 已登录：身份卡 -->
  <section id="identityPanel" class="card identity" hidden>
    <div class="avatar" id="avatar">—</div>
    <div class="who">
      <div class="who-label">当前登录</div>
      <div class="who-name" id="credDisplay">—</div>
      <div class="who-sub">账号 <span id="credAccount">—</span></div>
    </div>
    <div style="flex:1"></div>
    <button id="btnSwitch" class="ghost">切换登录</button>
  </section>

  <!-- ③ 仅登录后可见 -->
  <div id="authedArea" hidden>
    <div class="card">
      <h2>自动化设置</h2>
      <div class="switches">
        <label class="switch">
          <input type="checkbox" id="enabled"><span>启用定时任务</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="dryRun"><span>演练模式（不真正提交）</span>
        </label>
      </div>
      <div id="alwaysOnNote" class="note" hidden></div>
      <div id="jobTimes" class="fields" style="margin-top:18px"></div>
      <div id="options" class="fields" style="margin-top:18px"></div>
      <div class="row" style="margin-top:20px">
        <button id="btnSave">保存设置</button>
      </div>
    </div>

    <div class="card" id="viewsCard" hidden>
      <h2>订餐查看</h2>
      <div class="row" style="margin-bottom:14px">
        <label style="margin:0">日期</label>
        <input type="date" id="viewDate" style="width:auto">
        <div class="row" id="viewButtons" style="flex:1"></div>
      </div>
      <div id="viewResult" class="muted">选择上方按钮查看</div>
    </div>

    <div class="card">
      <h2>立即执行</h2>
      <div class="row" id="runButtons"></div>
    </div>

    <div class="card">
      <h2>运行记录</h2>
      <div id="runs" class="muted">暂无记录</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let toastTimer;
function toast(m,k=''){const t=$('#toast');t.textContent=m;t.className='toast show '+k;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3200);}
const KEY = location.pathname.split('/').pop();

/* ---------- 全局忙碌指示 ---------- */
let busyCount = 0, barTimer;
function busyPush(){
  if(busyCount++ === 0){
    const bar = $('#topbar');
    bar.className = 'on'; bar.style.width = '8%';
    let p = 8;
    clearInterval(barTimer);
    barTimer = setInterval(()=>{
      // 慢慢爬到 90%，真正的 100% 由请求结束时触发
      p = Math.min(90, p + Math.max(0.6, (90 - p) * 0.06));
      bar.style.width = p + '%';
    }, 200);
  }
}
function busyPop(){
  if(--busyCount > 0) return;
  busyCount = 0;
  clearInterval(barTimer);
  const bar = $('#topbar');
  bar.style.width = '100%';
  setTimeout(()=>{ bar.className = ''; bar.style.width = '0'; }, 260);
}

/* 把按钮切成加载态，返回恢复函数 */
function withLoading(btn, text){
  if(!btn) return ()=>{};
  const html = btn.innerHTML;
  btn.classList.add('loading');
  btn.disabled = true;
  if(text) btn.setAttribute('data-loading-text', text);
  return ()=>{ btn.classList.remove('loading'); btn.disabled = false; btn.innerHTML = html; };
}

async function api(p,o={}){
  busyPush();
  try{
    const r=await fetch(p,{headers:{'content-type':'application/json'},...o});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){location.href='/login';throw new Error('未登录');}
    if(!r.ok) throw new Error(d.detail||('HTTP '+r.status));
    return d;
  } finally { busyPop(); }
}
const STATE_LABEL={not_configured:['未配置',''],active:['已登录','on'],
  expired:['登录失效','err'],error:['异常','err']};

let detail = null;

function renderFields() {
  $('#fields').innerHTML = detail.credential_fields.map(f=>{
    const input = `<input id="f-${f.name}" data-field="${f.name}"
           type="${f.type==='password'?'password':'text'}"
           ${f.secret?'data-secret="1"':''}
           placeholder="${f.type==='password'?'请输入密码':''}"
           autocomplete="${f.secret?'current-password':'username'}">`;
    const label = `<label for="f-${f.name}">${f.label}</label>`;
    if(!f.action) return label + input;
    // 需要先发验证码的字段：输入框与按钮并排
    return label + `<div class="row" style="gap:8px;flex-wrap:nowrap">
        <div style="flex:1">${input}</div>
        <button type="button" class="ghost" data-action="${f.action}" style="white-space:nowrap">
          ${f.action_label || '发送'}</button>
      </div>`;
  }).join('');

  document.querySelectorAll('[data-action]').forEach(b=>{
    b.onclick = async () => {
      // 发码只需要 phone，取当前表单里所有非验证码字段
      const payload = {};
      document.querySelectorAll('[data-field]').forEach(i=>{
        if(i.dataset.field !== 'code') payload[i.dataset.field] = i.value.trim();
      });
      const restore = withLoading(b, '发送中…');
      try {
        const r = await api(`/api/features/${KEY}/action?action=${encodeURIComponent(b.dataset.action)}`,
          {method:'POST', body: JSON.stringify(payload)});
        toast(r.message || '已发送', 'ok');
        startCooldown(b, 60);
        // 焦点移到验证码框，省得用户自己点
        document.querySelector('[data-field="code"]')?.focus();
      } catch(e){
        toast(e.message, 'err');
        restore();
      }
    };
  });
}

/* 发码后倒计时，避免用户连续点触发限流 */
function startCooldown(btn, seconds){
  const original = btn.dataset.label || btn.textContent.trim();
  btn.dataset.label = original;
  btn.classList.remove('loading');
  let left = seconds;
  btn.disabled = true;
  btn.textContent = `${left}s 后可重发`;
  const timer = setInterval(()=>{
    left -= 1;
    if(left <= 0){
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = original;
      return;
    }
    btn.textContent = `${left}s 后可重发`;
  }, 1000);
}

function renderJobs() {
  $('#jobTimes').innerHTML = detail.jobs.filter(j=>j.editable).map(j=>{
    const cur = (detail.config.schedule||{})[j.job_id] || j.default || {};
    const txt = j.trigger==='cron'
      ? `${String(cur.hour??9).padStart(2,'0')}:${String(cur.minute??0).padStart(2,'0')}`
      : `每 ${cur.minutes??cur.hours??30} 分钟`;
    return `<label>${j.name}（${j.trigger==='cron'?'时刻 HH:MM':'间隔'}）</label>
            <input data-sched="${j.job_id}" value="${txt}">
            <div class="muted" style="font-size:12px;margin-top:4px">
              下次：${j.next_run||'未启用'}${j.failures>=3?` · <span class="err">连续失败 ${j.failures} 次</span>`:''}
            </div>`;
  }).join('');

  // 常开任务（登录保活）是基础设施，不受开关控制，单独说明而不是给开关
  const always = detail.jobs.filter(j=>j.always_on);
  const note = $('#alwaysOnNote');
  if(always.length){
    note.hidden = false;
    note.innerHTML = always.map(j=>{
      const cur = j.trigger==='interval'
        ? `每 ${j.default?.minutes ?? 30} 分钟` : j.default?.hour??'';
      const next = j.next_run ? `下次 ${j.next_run}` : '尚未排期';
      return `<div><span class="dot"></span><b>${j.name}</b> 自动运行（${cur}），
              用于保持登录状态，无需手动开启。${next}</div>`;
    }).join('');
  } else {
    note.hidden = true;
  }

  $('#runButtons').innerHTML = detail.jobs.map(j=>
    `<button class="ghost" data-run="${j.job_id}">立即执行：${j.name}</button>`).join('');
  document.querySelectorAll('[data-run]').forEach(b=>{
    b.onclick = async () => {
      const restore = withLoading(b, '执行中…');
      toast('正在执行，请稍候…');
      try {
        const r = await api(`/api/features/${KEY}/run`,
          {method:'POST', body: JSON.stringify({job_id: b.dataset.run})});
        toast(r.message || (r.ok?'完成':'失败'), r.ok?'ok':'err');
        await loadRuns();
      } catch(e){ toast(e.message,'err'); }
      finally { restore(); }
    };
  });
}

function renderOptions() {
  $('#options').innerHTML = (detail.extra_options||[]).map(o=>{
    const raw = (detail.option_values||{})[o.name] || [];
    // 后端给的是 [{project_id, name}]，统一成 {value,label}
    const items = raw.map(x=>({value: x.value ?? x.project_id, label: x.label ?? x.name}));
    const cur = (detail.config.options||{})[o.name] || '';
    if (o.type === 'select') {
      return `<label>${o.label}</label>
        <div class="row"><select data-opt="${o.name}" style="flex:1">
          ${items.map(i=>`<option value="${i.value}" ${i.value==cur?'selected':''}>${i.label}</option>`).join('')}
        </select>${o.refreshable?`<button class="ghost" data-refresh="${o.name}">刷新</button>`:''}</div>`;
    }
    return `<label>${o.label}</label><input data-opt="${o.name}" value="${cur}">`;
  }).join('');
  document.querySelectorAll('[data-refresh]').forEach(b=>{
    b.onclick = async () => {
      const restore = withLoading(b, '刷新中…');
      toast('正在向 HEM 拉取项目列表…');
      try { await api(`/api/features/${KEY}/options/refresh`,{method:'POST'});
            toast('已刷新','ok'); await load(); }
      catch(e){ toast(e.message,'err'); }
      finally { restore(); }
    };
  });
}

async function loadRuns() {
  const {runs} = await api(`/api/features/${KEY}/runs?limit=20`);
  $('#runs').innerHTML = runs.length ? runs.map(r=>
    `<div class="logline"><span class="t">${r.time}</span>
     <span class="${r.ok?'ok':'err'}">${r.ok?'成功':'失败'}</span>
     <span class="muted">[${r.job_id}]</span> ${r.message||''}</div>`).join('')
    : '<span class="muted">暂无记录</span>';
}

/* 是否已登录：只有 active / expired / error 才算配过凭据；
   expired / error 仍显示身份卡，便于用户直接点「切换登录」修复。 */
function isLoggedIn(){
  return detail.state === 'active';
}

/* 切换面板显隐。switching=true 表示已登录用户主动点了「切换登录」 */
function applyLayout(switching){
  const authed = isLoggedIn() && !switching;
  $('#loginPanel').hidden = authed;
  $('#identityPanel').hidden = !isLoggedIn() || switching;
  $('#authedArea').hidden = !authed;

  // 「取消」只在已登录、且是主动切换时出现
  $('#btnCancelSwitch').hidden = !(switching && isLoggedIn());

  // 未登录时登录框标题强调，切换时提示会清空什么
  $('#loginTitle').textContent = switching ? '切换到其他账号'
    : (isLoggedIn() ? '登录' : '请先登录');

  const [label,cls] = STATE_LABEL[detail.state]||[detail.state,''];
  $('#stateBadge').textContent = label;
  $('#stateBadge').className = 'badge ' + cls;

  // 失效/异常时把具体原因告诉用户，否则只会看到「登录失效」不知所措
  const hint = $('#credHint');
  if((detail.state === 'expired' || detail.state === 'error') && detail.last_error){
    hint.innerHTML = `<span class="err">${detail.last_error}</span>`;
  }

  $('#credDisplay').textContent = detail.display || '—';
  $('#credAccount').textContent = detail.display || '—';
  // 头像取显示名首字
  $('#avatar').textContent = (detail.display || '?').trim().charAt(0) || '?';
}

async function load() {
  detail = await api(`/api/features/${KEY}`);
  document.title = detail.name;
  $('#fname').textContent = detail.name;
  $('#credHint').textContent = detail.credential_kind === 'interactive'
    ? '需要短信验证码 / 扫码，登录态失效后须重新登录'
    : '账号密码型，登录态失效会自动重登';
  $('#enabled').checked = !!detail.config.enabled;
  $('#dryRun').checked = !!detail.config.dry_run;
  applyLayout(switching);

  renderFields(); renderJobs(); renderOptions(); renderViews();
  if(isLoggedIn()) await loadRuns();
}

/* ---------- 只读查看视图 ---------- */
function renderViews(){
  const views = detail.views || [];
  const card = $('#viewsCard');
  if(!views.length){ card.hidden = true; return; }
  card.hidden = false;
  if(!$('#viewDate').value) $('#viewDate').value = new Date().toISOString().slice(0,10);
  $('#viewButtons').innerHTML = views.map(v=>
    `<button class="ghost" data-view="${v.view_id}" data-kind="${v.kind}">${v.name}</button>`).join('');
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick = async () => {
      const restore = withLoading(b);
      const box = $('#viewResult');
      box.innerHTML = '<span class="muted">查询中…</span>';
      try {
        const d = $('#viewDate').value;
        const r = await api(`/api/features/${KEY}/view/${b.dataset.view}?date=${encodeURIComponent(d)}`);
        box.innerHTML = renderViewData(b.dataset.kind, r.data);
      } catch(e){ box.innerHTML = `<span class="err">${e.message}</span>`; }
      finally { restore(); }
    };
  });
}

function esc(s){ return String(s ?? '').replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderViewData(kind, d){
  if(d.error) return `<span class="err">${esc(d.error)}</span>`;
  if(kind === 'status') return renderStatus(d);
  if(kind === 'recommend') return renderRecommend(d);
  if(kind === 'candidates') return renderCandidates(d);
  return `<pre>${esc(JSON.stringify(d,null,2))}</pre>`;
}

function renderStatus(d){
  if(!d.has_item) return `<div class="muted">${esc(d.date)} 没有可订餐次。</div>`;
  const badge = d.ordered
    ? '<span class="badge on">已订餐</span>'
    : '<span class="badge warn">未订餐</span>';
  let html = `<div class="row" style="margin-bottom:10px">${badge}
    <span class="muted">${esc(d.title||'')} · ${esc(d.date)}</span></div>`;
  const od = d.order_detail;
  if(d.ordered && od){
    html += '<div class="dish-list">' + (od.dishes||[]).map(x=>
      `<div class="dish"><span>${esc(x.name)}</span>
       <span class="muted">×${x.count||1}</span>
       <span class="price">¥${(x.price||0).toFixed(2)}</span></div>`).join('') + '</div>';
    if(od.postbox){
      const pb = typeof od.postbox==='object' ? od.postbox : {postboxCode:od.postbox};
      let txt = esc(pb.postboxCode||'');
      if(pb.postboxOpenTime){
        const t = new Date(pb.postboxOpenTime);
        txt += ` · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 开柜`;
      }
      html += `<div class="kv"><span>取餐柜</span><span>${txt}</span></div>`;
    }
    if(od.address){
      const ad = typeof od.address==='object' ? od.address : {address:od.address};
      const txt = [ad.address, ad.pickUpLocation].filter(Boolean).map(esc).join(' · ');
      if(txt) html += `<div class="kv"><span>地址</span><span>${txt}</span></div>`;
    }
  } else if(!d.ordered){
    html += '<div class="muted">尚未下单。可在「按口味推荐」里挑菜，或等定时任务自动订。</div>';
  }
  return html;
}

function dishRow(c, withScore){
  const score = withScore && c.score!=null
    ? `<span class="score">${c.score.toFixed(1)} 分</span>` : '';
  const reasons = withScore && (c.reasons||[]).length
    ? `<div class="muted reasons">${esc(c.reasons.join(' · '))}</div>` : '';
  return `<div class="dish">
    <div class="dish-main"><span class="dish-name">${esc(c.dish_name)}</span>${score}</div>
    <span class="muted">${esc(c.restaurant_name)}</span>
    <span class="price">¥${(c.price||0).toFixed(2)}</span>
    ${reasons}</div>`;
}

function renderRecommend(d){
  let html = `<div class="row" style="margin-bottom:10px">
    <span class="muted">${esc(d.title||'')} · ${esc(d.date)}</span>
    ${d.already_ordered?'<span class="badge on">已订餐</span>':''}
    <span class="muted">共 ${d.total_candidates||0} 个候选</span></div>`;
  if(d.history_summary) html += renderHistorySummary(d.history_summary);
  if(!(d.candidates||[]).length) return html + '<div class="muted">没有符合条件的推荐。</div>';
  html += '<div class="dish-list">' + d.candidates.map(c=>dishRow(c,true)).join('') + '</div>';
  return html;
}

function renderHistorySummary(s){
  if(typeof s === 'string') return `<div class="muted" style="margin-bottom:10px">${esc(s)}</div>`;
  const parts = [];
  if(s.sample_days) parts.push(`基于近 ${s.sample_days} 天历史`);
  const rests = (s.top_restaurants||[]).slice(0,3).map(x=>esc(x[0])).filter(Boolean);
  if(rests.length) parts.push('常点：' + rests.join('、'));
  const kws = (s.top_keywords||[]).slice(0,5).map(x=>esc(x[0])).filter(Boolean);
  if(kws.length) parts.push('偏好：' + kws.join('、'));
  if(!parts.length) return '<div class="muted" style="margin-bottom:10px">暂无历史偏好数据，按默认推荐</div>';
  return `<div class="muted" style="margin-bottom:10px">${parts.join(' · ')}</div>`;
}

function renderCandidates(d){
  let html = `<div class="row" style="margin-bottom:10px">
    <span class="muted">${esc(d.title||'')} · ${esc(d.date)}</span>
    ${d.already_ordered?'<span class="badge on">已订餐</span>':''}
    <span class="muted">共 ${d.total_candidates||0} 道菜</span></div>`;
  if(!(d.candidates||[]).length) return html + '<div class="muted">当天没有可订菜品。</div>';
  html += '<div class="dish-list">' + d.candidates.map(c=>dishRow(c,false)).join('') + '</div>';
  return html;
}

/* 切换登录的临时状态 */
let switching = false;

$('#btnSwitch').onclick = () => {
  switching = true;
  applyLayout(true);
  renderFields();               // 重建输入框，密码不残留
  $('#loginPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
};

$('#btnCancelSwitch').onclick = () => {
  switching = false;
  applyLayout(false);
};

$('#btnLogin').onclick = async () => {
  const payload = {};
  // 密码类字段原样提交，不 trim（首尾空格可能是密码的一部分）
  document.querySelectorAll('[data-field]').forEach(i=>{
    payload[i.dataset.field] = i.dataset.secret ? i.value : i.value.trim();
  });
  const restore = withLoading($('#btnLogin'), '登录中…');
  toast('正在登录并拉取项目列表，约需数秒…');
  try {
    const d = await api(`/api/features/${KEY}/login`,{method:'POST',body:JSON.stringify(payload)});
    toast('登录成功：' + (d.display||''),'ok');
    switching = false;            // 登录成功即退出切换态
    await load();
  } catch(e){ toast(e.message,'err'); }
  finally { restore(); }
};

function parseTimeInput(text, prev) {
  // 支持 "HH:MM" 或 "每 N 分钟"
  const m = text.match(/每\s*(\d+)\s*分钟/);
  if (m) return { minutes: parseInt(m[1], 10) };
  const t = text.match(/(\d{1,2})\s*:\s*(\d{1,2})/);
  if (t) return { hour: parseInt(t[1], 10), minute: parseInt(t[2], 10) };
  return prev;
}

$('#btnSave').onclick = async () => {
  const schedule = { ...(detail.config.schedule || {}) };
  document.querySelectorAll('[data-sched]').forEach(i => {
    schedule[i.dataset.sched] = parseTimeInput(i.value, schedule[i.dataset.sched] || {});
  });
  const options = { ...(detail.config.options || {}) };
  document.querySelectorAll('[data-opt]').forEach(i => { options[i.dataset.opt] = i.value; });
  const restore = withLoading($('#btnSave'), '保存中…');
  try {
    await api(`/api/features/${KEY}/config`, {method:'POST', body: JSON.stringify({
      enabled: $('#enabled').checked, dry_run: $('#dryRun').checked, schedule, options
    })});
    toast('设置已保存','ok');
    await load();
  } catch(e){ toast(e.message,'err'); }
  finally { restore(); }
};

/* 首屏加载：标题旁显示「加载中」，而不是干等 */
(function boot(){
  const badge = $('#stateBadge');
  badge.textContent = '加载中…'; badge.className = 'badge busy';
  load().catch(e => { toast(e.message,'err');
    badge.textContent='加载失败'; badge.className='badge err'; });
})();
</script>
</body>
</html>
